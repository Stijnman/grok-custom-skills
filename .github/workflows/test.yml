name: Test Skills

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  pull-requests: read

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          
      - name: Install dependencies
        run: |
          pip install pytest pytest-mock pytest-cov
          
      - name: Run repository validation pipeline
        run: python3 scripts/optimize_all_skills.py
        
      - name: Run catalog regression tests
        run: python3 -m unittest discover -s tests -p "test_*.py"
        
      - name: Confirm repository formatting and generated catalog are current
        run: |
          git diff --check
          git diff --exit-code -- SKILLS_INDEX.md

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          
      - name: Install dependencies
        run: |
          pip install pytest pytest-mock pytest-cov
          
      - name: Run tests with coverage
        run: |
          pytest tests/ -v --tb=short --cov=tests --cov-report=xml --cov-report=html
          
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        if: always()
        with:
          files: ./coverage.xml
          flags: tests
          name: tests-coverage

  lint:
    name: Lint Documentation
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Install markdownlint
        run: |
          npm install -g markdownlint-cli2
          
      - name: Lint all SKILL.md files
        run: |
          find .grok/skills -name "SKILL.md" -type f -exec markdownlint-cli2 --config .markdownlint.json {} \;
          
      - name: Lint README.md
        run: |
          markdownlint-cli2 --config .markdownlint.json README.md
          
      - name: Lint CONTRIBUTING.md
        run: |
          markdownlint-cli2 --config .markdownlint.json CONTRIBUTING.md
          
      - name: Lint TESTING.md
        run: |
          markdownlint-cli2 --config .markdownlint.json TESTING.md
          
      - name: Lint SKILL.md
        run: |
          markdownlint-cli2 --config .markdownlint.json SKILL.md

  spellcheck:
    name: Spell Check
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Install codespell
        run: |
          pip install codespell
          
      - name: Check spelling
        run: |
          codespell --skip ".git,*.json,*.yml,*.yaml,CHANGELOG.md,SKILLS_INDEX.md" \
            --ignore-words-list "grok,skills,agent,mcp,AI,orignal,workflow,metadata,frontend,backend" \
            --check-filenames \
            --check-hidden

  security-check:
    name: Security Scan
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Run no private data check
        run: python3 scripts/check_no_private_data.py
        
      - name: Run publish safety check
        run: python3 scripts/publish_safety_check.py
        
      - name: Check for hardcoded secrets
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --debug --only-verified
          
