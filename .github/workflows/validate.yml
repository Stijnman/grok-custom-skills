name: Validate skill collection

on:
  pull_request:
    paths:
      - ".grok/skills/**"
      - "scripts/**"
      - "SKILLS_INDEX.md"
      - ".github/workflows/validate.yml"
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run repository validation pipeline
        run: python3 scripts/optimize_all_skills.py
      - name: Run catalog regression tests
        run: python3 -m unittest discover -s tests -p "test_*.py"
      - name: Confirm repository formatting and generated catalog are current
        run: |
          git diff --check
          git diff --exit-code -- SKILLS_INDEX.md
